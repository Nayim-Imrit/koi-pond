<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nishikigoi Sanctuary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Serif+JP:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <header class="brand">
        <p class="kana">錦鯉聖域</p>
        <h1>Nishikigoi Sanctuary</h1>
        <p class="sub">Waterfall lotus garden · twenty-two living koi</p>
      </header>
      <div class="controls">
        <button id="feedBtn" type="button">Feed Koi</button>
        <button id="viewBtn" type="button">Camera: Orbit</button>
        <button id="hourBtn" type="button">Golden Hour</button>
      </div>
      <p class="hint">Drag to orbit · scroll to zoom · tap the pond to toss pellets</p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
